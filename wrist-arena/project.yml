# Opis projektu dla XcodeGen. Projekt .xcodeproj generujemy, nie commitujemy:
#   cd wrist-arena && xcodegen generate
name: WristArena

options:
  bundleIdPrefix: com.meeshor
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: pl

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  WristKit:
    path: ../WristKit
  ArenaCore:
    path: ArenaCore

targets:
  WristArena:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    dependencies:
      - package: WristKit
        product: WristKit
      - package: WristKit
        product: WristKitDevice
      - package: ArenaCore
        product: ArenaCore
      - target: WristArenaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).wristarena
        PRODUCT_NAME: Wrist Arena
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wrist Arena
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"

  WristArenaWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
    dependencies:
      - package: WristKit
        product: WristKit
      - package: WristKit
        product: WristKitDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).wristarena.watchkitapp
        PRODUCT_NAME: Wrist Arena
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wrist Arena
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).wristarena
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES

schemes:
  WristArena:
    build:
      targets:
        WristArena: all
        WristArenaWatch: all
    run:
      config: Debug
  WristArenaWatch:
    build:
      targets:
        WristArenaWatch: all
    run:
      config: Debug

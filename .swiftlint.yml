included:
  - WristKit
  - wrist-arena
excluded:
  - "**/.build"
  - "**/DerivedData"
  - wrist-arena/WristArena.xcodeproj

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - toggle_bool

identifier_name:
  min_length: 1
  max_length: 50

type_name:
  min_length: 2

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_parameter_count:
  warning: 8
  error: 12

large_tuple:
  warning: 4
  error: 5
